<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="16" fill="#0e2945"/><text x="36" y="58" fill="#ffe4a3" font-family="Arial" font-size="28">Timeline Interpretation Note: Peristalsis</text><rect x="36" y="110" width="348" height="210" rx="12" fill="#183c5f" stroke="#5287db" stroke-width="4"/><text x="56" y="151" fill="#fff" font-family="Arial" font-size="23">Earlier image</text><text x="56" y="204" fill="#e1ecf4" font-family="Arial" font-size="19">Observe the feature’s</text><text x="56" y="232" fill="#e1ecf4" font-family="Arial" font-size="19">position</text><path d="M 389 219 h 25 m -10 -10 l 10 10 -10 10" fill="none" stroke="#efb94e" stroke-width="5"/><rect x="426" y="110" width="348" height="210" rx="12" fill="#183c5f" stroke="#5badbf" stroke-width="4"/><text x="446" y="151" fill="#fff" font-family="Arial" font-size="23">Available comparison</text><text x="446" y="204" fill="#e1ecf4" font-family="Arial" font-size="19">Check the same region and</text><text x="446" y="232" fill="#e1ecf4" font-family="Arial" font-size="19">projection</text><path d="M 779 219 h 25 m -10 -10 l 10 10 -10 10" fill="none" stroke="#efb94e" stroke-width="5"/><rect x="816" y="110" width="348" height="210" rx="12" fill="#183c5f" stroke="#a889c9" stroke-width="4"/><text x="836" y="151" fill="#fff" font-family="Arial" font-size="23">Movement along route</text><text x="836" y="204" fill="#e1ecf4" font-family="Arial" font-size="19">Supports possible</text><text x="836" y="232" fill="#e1ecf4" font-family="Arial" font-size="19">swallowed contents</text><rect x="36" y="353" width="1128" height="111" rx="10" fill="#fff6df"/><text x="57" y="388" fill="#193b5a" font-family="Arial" font-size="19">Peristalsis is muscular movement along the tract; this comparison diagram is conceptual.</text></svg>