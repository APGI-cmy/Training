<!doctype html><title>Activity save recovery and preservation</title><style>body{font:17px Arial}iframe{width:100%;height:600px}</style><h1>Activity save recovery and preservation</h1><p id="status">Running…</p><ol id="results"></ol><iframe id="activity" title="Activity recovery test"></iframe><script type="module">
import {attachActivitySequence} from './modules/learning-sequence-dom.js';
const frame=document.getElementById('activity'),results=document.getElementById('results'),delay=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(ok,message)=>{const li=document.createElement('li');li.textContent=(ok?'PASS ':'FAIL ')+message;results.append(li);if(!ok)throw Error(message);};
try{await new Promise(resolve=>{frame.onload=resolve;frame.src='/courses/Tiger%20kidnapping_telecommunications/LU1/res/data/wo4/index.html';});const doc=frame.contentDocument;
let offline=true,backend={through:-1,summary:false},calls=[];
const controller=attachActivitySequence(doc,{load:()=>undefined,save:async r=>{if(offline)throw Error('offline');if(r.through>backend.through+1)throw Error('skipped evidence');backend={through:Math.max(backend.through,r.through),summary:backend.summary||r.summary};calls.push(r.through);},completed:()=>false,changed:()=>{}});
doc.getElementById('begin').click();await delay(20);const stages=Array.from(doc.querySelectorAll('[data-stage]'));
const key=new doc.defaultView.KeyboardEvent('keydown',{key:'End',bubbles:true,cancelable:true});stages[0].dispatchEvent(key);assert(key.defaultPrevented,'Keyboard cannot skip locked sections');
for(const stage of stages){stage.click();controller.refresh();}doc.getElementById('summary').click();controller.refresh();await delay(30);assert(!controller.canLeave(),'Save failure cannot unlock Next');const retry=doc.querySelector('[data-learning-sequence-guidance] button');assert(!retry.hidden,'Retry saving is visible');offline=false;retry.click();await delay(100);controller.refresh();assert(controller.canLeave(),'Retry replays missing evidence in order and unlocks Next');assert(JSON.stringify(calls)==='[0,1,2,3,3]','No skipped or lost checkpoint after an initial network failure');stages[0].click();assert(controller.canLeave(),'Revisiting an earlier section preserves saved completion');controller.dispose();
let writes=0;const completed=attachActivitySequence(doc,{load:()=>undefined,save:async()=>{writes++;},completed:()=>true,changed:()=>{}});assert(completed.canLeave(),'Earlier valid completion remains unlocked');assert(Array.from(doc.querySelectorAll('[data-stage]')).every(b=>!b.disabled),'Earlier completion permits every section');completed.refresh();await delay(20);assert(writes===0,'Compatibility does not fabricate historical step evidence');completed.dispose();document.getElementById('status').textContent='DONE: all recovery and preservation checks passed.';
}catch(error){document.getElementById('status').textContent='FAILED: '+error.message;}
</script>
