<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="4. Produced only when needed">
  <rect width="1200" height="650" fill="#071a31"/>
  <rect x="32" y="30" width="1136" height="590" rx="18" fill="#0c2545" stroke="#31577f" stroke-width="2"/>
  <text x="70" y="88" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">4. Produced only when needed</text>
  <text x="70" y="124" fill="#c9d9eb" font-family="Arial, Helvetica, sans-serif" font-size="21">Scannex creates X-rays inside a sealed tube only while an authorised exposure is active.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#f4c64d"/></marker><filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="115" y="190" width="440" height="300" rx="145" fill="#102e51" stroke="#8da7c5" stroke-width="5"/>
  <rect x="165" y="250" width="92" height="180" rx="35" fill="#354a62"/><text x="211" y="457" text-anchor="middle" fill="#c9d9eb" font-family="Arial" font-size="17">Cathode</text>
  <rect x="410" y="250" width="92" height="180" rx="35" fill="#5d6c7c"/><text x="456" y="457" text-anchor="middle" fill="#c9d9eb" font-family="Arial" font-size="17">Target</text>
  <path d="M265 340 L391 340" stroke="#78d4ef" stroke-width="9" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
  <text x="326" y="315" text-anchor="middle" fill="#dff4ff" font-family="Arial" font-size="18">electrons move</text>
  <path d="M504 340 L645 340" stroke="#f4c64d" stroke-width="13" marker-end="url(#arrow)" filter="url(#glow)"/>
  <text x="570" y="312" text-anchor="middle" fill="#fff3c2" font-family="Arial" font-size="18">X-rays leave tube</text>
  <rect x="690" y="205" width="390" height="123" rx="14" fill="#142f4d" stroke="#6fc3e4" stroke-width="2"/><circle cx="733" cy="250" r="16" fill="#7bbd7f"/><text x="768" y="257" fill="#ffffff" font-family="Arial" font-size="25" font-weight="700">Before / after scan</text><text x="768" y="294" fill="#d5e5f5" font-family="Arial" font-size="20">Tube idle — no X-rays present</text>
  <rect x="690" y="360" width="390" height="123" rx="14" fill="#3a2e17" stroke="#f4c64d" stroke-width="2"/><circle cx="733" cy="405" r="16" fill="#f4c64d" filter="url(#glow)"/><text x="768" y="412" fill="#fff3c2" font-family="Arial" font-size="25" font-weight="700">During authorised scan</text><text x="768" y="449" fill="#fff3c2" font-family="Arial" font-size="20">Tube energised — X-rays produced</text>
  <rect x="134" y="540" width="930" height="54" rx="10" fill="#163959"/><text x="600" y="575" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="21" font-weight="600">The source is switched off after the exposure: radiation does not remain in the room or person.</text></svg>