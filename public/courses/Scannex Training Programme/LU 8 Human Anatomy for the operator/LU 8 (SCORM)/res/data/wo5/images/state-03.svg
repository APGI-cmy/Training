<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="16" fill="#0e2945"/><text x="36" y="58" fill="#ffe4a3" font-family="Arial" font-size="28">Check for known skeletal anatomy</text><rect x="36" y="110" width="348" height="210" rx="12" fill="#183c5f" stroke="#5287db" stroke-width="4"/><text x="56" y="151" fill="#fff" font-family="Arial" font-size="23">Spine and upper neck</text><text x="56" y="204" fill="#e1ecf4" font-family="Arial" font-size="19">Pedicles, spinous</text><text x="56" y="232" fill="#e1ecf4" font-family="Arial" font-size="19">processes and atlas</text><path d="M 389 219 h 25 m -10 -10 l 10 10 -10 10" fill="none" stroke="#efb94e" stroke-width="5"/><rect x="426" y="110" width="348" height="210" rx="12" fill="#183c5f" stroke="#5badbf" stroke-width="4"/><text x="446" y="151" fill="#fff" font-family="Arial" font-size="23">Limbs and joints</text><text x="446" y="204" fill="#e1ecf4" font-family="Arial" font-size="19">Carpal bones, tarsal bones</text><text x="446" y="232" fill="#e1ecf4" font-family="Arial" font-size="19">and patella</text><path d="M 779 219 h 25 m -10 -10 l 10 10 -10 10" fill="none" stroke="#efb94e" stroke-width="5"/><rect x="816" y="110" width="348" height="210" rx="12" fill="#183c5f" stroke="#a889c9" stroke-width="4"/><text x="836" y="151" fill="#fff" font-family="Arial" font-size="23">Explain normal</text><text x="836" y="183" fill="#fff" font-family="Arial" font-size="23">features</text><text x="836" y="204" fill="#e1ecf4" font-family="Arial" font-size="19">Check their anatomical</text><text x="836" y="232" fill="#e1ecf4" font-family="Arial" font-size="19">continuity</text><rect x="36" y="353" width="1128" height="111" rx="10" fill="#fff6df"/><text x="57" y="388" fill="#193b5a" font-family="Arial" font-size="19">Known anatomical structures should be accounted for before an anomaly is assessed.</text></svg>