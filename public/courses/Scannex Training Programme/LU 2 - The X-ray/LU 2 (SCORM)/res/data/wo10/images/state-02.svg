<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="3. Why X-rays are ionising">
  <rect width="1200" height="650" fill="#071a31"/>
  <rect x="32" y="30" width="1136" height="590" rx="18" fill="#0c2545" stroke="#31577f" stroke-width="2"/>
  <text x="70" y="88" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">3. Why X-rays are ionising</text>
  <text x="70" y="124" fill="#c9d9eb" font-family="Arial, Helvetica, sans-serif" font-size="21">A high-energy X-ray photon can remove an electron from an atom. This is why exposure is controlled.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#f4c64d"/></marker><filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <g transform="translate(510 350)"><circle r="73" fill="#f0b543" opacity=".9"/><circle r="41" fill="#fff2ba"/><circle r="145" fill="none" stroke="#6fc3e4" stroke-width="4"/><circle r="210" fill="none" stroke="#6fc3e4" stroke-width="4" opacity=".75"/><circle cx="-120" cy="-82" r="16" fill="#82d1ed"/><circle cx="130" cy="67" r="16" fill="#82d1ed"/><circle cx="-30" cy="-207" r="16" fill="#82d1ed"/><circle cx="245" cy="-130" r="16" fill="#f4c64d" filter="url(#glow)"/></g>
  <path d="M130 255 L375 306" stroke="#f4c64d" stroke-width="15" stroke-dasharray="17 14" marker-end="url(#arrow)"/><rect x="90" y="183" width="278" height="60" rx="30" fill="#163959" stroke="#f4c64d" stroke-width="2"/><text x="115" y="221" fill="#fff3c2" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">High-energy X-ray photon</text>
  <path d="M 748 229 L 850 260" stroke="#f4c64d" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="850" y="214" width="282" height="94" rx="12" fill="#163959" stroke="#f4c64d" stroke-width="2"/><text x="874" y="253" fill="#fff3c2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Electron is ejected</text><text x="874" y="282" fill="#fff3c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">from the atom</text>
  <rect x="735" y="418" width="335" height="104" rx="12" fill="#163959" stroke="#6fc3e4" stroke-width="2"/><text x="762" y="456" fill="#dff4ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Atom becomes ionised</text><text x="762" y="487" fill="#dff4ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">after losing an electron</text><path d="M 732 445 L 631 387" stroke="#6fc3e4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="32" y="550" width="1136" height="47" rx="10" fill="#fff2d8"/><text x="600" y="581" text-anchor="middle" fill="#263a51" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">Controlled time, distance and shielding keep this useful imaging energy within approved operating limits.</text></svg>