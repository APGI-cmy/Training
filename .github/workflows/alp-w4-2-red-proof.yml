name: ALP W4.2 Build to Green

on:
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "supabase/migrations/006_alp_admin_invitations.sql"
      - "tests/qa-to-red/alp/w4-2-enrolment-catalogue-red.spec.ts"
      - "package.json"
      - ".github/workflows/alp-w4-2-red-proof.yml"
      - "modules/ALP/11-build/evidence/**"
      - "modules/ALP/BUILD_PROGRESS_TRACKER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-build-green:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Execute W4.2 GREEN suite
        run: npm run test:alp:w4-2

      - name: Build application
        run: npm run build
