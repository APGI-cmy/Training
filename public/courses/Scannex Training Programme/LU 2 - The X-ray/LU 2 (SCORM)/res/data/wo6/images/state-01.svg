<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="1. One electromagnetic family">
  <rect width="1200" height="650" fill="#071a31"/>
  <rect x="32" y="30" width="1136" height="590" rx="18" fill="#0c2545" stroke="#31577f" stroke-width="2"/>
  <text x="70" y="88" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">1. One electromagnetic family</text>
  <text x="70" y="124" fill="#c9d9eb" font-family="Arial, Helvetica, sans-serif" font-size="21">X-rays occupy one labelled band of the electromagnetic spectrum.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#f4c64d"/></marker><filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <line x1="105" y1="310" x2="1090" y2="310" stroke="#d7e7f8" stroke-width="6"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="106" y="264" width="140" height="92" rx="8" fill="#5a70a7"/><text x="176" y="301" fill="#fff">Radio</text><text x="176" y="326" fill="#fff">waves</text>
    <rect x="247" y="264" width="130" height="92" rx="8" fill="#4989b8"/><text x="312" y="315" fill="#fff">Microwaves</text>
    <rect x="378" y="264" width="130" height="92" rx="8" fill="#4bb6b7"/><text x="443" y="315" fill="#fff">Infrared</text>
    <rect x="509" y="264" width="105" height="92" rx="8" fill="#85bf52"/><text x="561" y="315" fill="#0f2942">Visible</text>
    <rect x="615" y="264" width="125" height="92" rx="8" fill="#a77cc9"/><text x="677" y="315" fill="#fff">Ultraviolet</text>
    <rect x="741" y="244" width="160" height="132" rx="10" fill="#edaa36" stroke="#fff3c2" stroke-width="5" filter="url(#glow)"/><text x="821" y="301" fill="#142944" font-size="25">X-RAYS</text><text x="821" y="331" fill="#142944" font-size="16">Scannex band</text>
    <rect x="902" y="264" width="170" height="92" rx="8" fill="#d45e76"/><text x="987" y="315" fill="#fff">Gamma rays</text>
  </g>
  <path d="M 160 430 L 1010 430" stroke="#7bc4e2" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="160" y="475" fill="#d4e8f5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Longer wavelength</text><text x="865" y="475" fill="#d4e8f5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Shorter wavelength</text>
  <path d="M 1010 530 L 160 530" stroke="#f4c64d" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="150" y="575" fill="#fff0bb" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Lower energy</text><text x="910" y="575" fill="#fff0bb" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Higher energy</text>
  <path d="M821 202 L821 160" stroke="#f4c64d" stroke-width="4"/><rect x="657" y="141" width="330" height="50" rx="25" fill="#163959" stroke="#f4c64d" stroke-width="2"/><text x="682" y="174" fill="#fff3c2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">X-rays are one family member</text></svg>