<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img"><title>Recommend retaining the virtual discussion, explaining why and asking for the business decision.</title><rect width="720" height="240" rx="20" fill="#eaf3f4"/><rect width="178" height="240" rx="20" fill="#d7e0fc"/><g stroke="#143c55" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M35 165V70h105v95zM55 100h65M55 120h45M55 140h55"/><path d="m110 50 18-18 18 18"/></g><text x="205" y="38" font-family="Arial" font-size="14" fill="#38677a">APPLY THE IDEA · 07</text><text x="205" y="70" font-family="Arial" font-size="22" font-weight="bold" fill="#122e45">Recommend retaining the virtual</text><text x="205" y="95" font-family="Arial" font-size="22" font-weight="bold" fill="#122e45">discussion, explaining why and asking</text><text x="205" y="123" font-family="Arial" font-size="16" fill="#214b60">This is a defensible recommendation,</text><text x="205" y="143" font-family="Arial" font-size="16" fill="#214b60">not an already confirmed case outcome</text></svg>