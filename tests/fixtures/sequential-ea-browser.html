<!doctype html><meta charset="utf-8"><title>EA navigation compatibility check</title><style>body{font:16px Arial}iframe{height:680px;width:100%}</style><h1>EA navigation compatibility check</h1><p id="status">Preparing local course check…</p><ol id="results"></ol><iframe id="activity" title="EA local player check"></iframe><script type="module">
import {attachTrainingSequencing} from './modules/training-player-sequencing.js';
const frame=document.getElementById('activity'),results=document.getElementById('results'),status=document.getElementById('status');const delay=ms=>new Promise(r=>setTimeout(r,ms));const assert=(ok,text)=>{const li=document.createElement('li');li.textContent=(ok?'PASS ':'FAIL ')+text;results.append(li);if(!ok)throw Error(text);};
const values={'cmi.entry':'ab-initio','cmi.mode':'normal','cmi.credit':'credit','cmi.completion_status':'unknown','cmi.learner_id':'local-fixture','cmi.learner_name':'Local fixture'};window.API_1484_11={Initialize:()=> 'true',Terminate:()=> 'true',GetValue:k=>values[k]||'',SetValue:(k,v)=>{values[k]=v;return 'true';},Commit:()=> 'true',GetLastError:()=> '0',GetErrorString:()=> '',GetDiagnostic:()=> ''};
const core=attachTrainingSequencing({host:window,frame,records:[],save:async r=>r,completed:()=>false,status:t=>status.textContent=t});
try{await new Promise(resolve=>{frame.onload=resolve;frame.src='/courses/Executive%20Assistant%20Training%20Programme/LU1/course/index.html';});const doc=frame.contentDocument;for(let i=0;i<1000&&!doc.getElementById('title')?.textContent?.trim();i++)await delay(100);await delay(700);const ack=doc.querySelector('#acknowledge'),next=doc.querySelector('#next');assert(!!ack&&!!next,'Original EA player controls are present');assert(!next.hasAttribute('data-learning-sequence-locked'),'Existing scene and formative navigation remains owned by the EA course');assert(!doc.querySelector('#contents button[aria-current="step"]').disabled,'Current activity remains accessible');assert([...doc.querySelectorAll('#contents button')].slice(1).every(b=>b.disabled),'Later activity entries wait for the current acknowledgement');assert(values['cmi.success_status']!=='passed','Navigation control does not pass the knowledge assessment');core.dispose();
 const check=document.createElement('iframe');document.body.append(check);await new Promise(resolve=>{check.onload=resolve;check.srcdoc='<div id="contents"><button aria-current="step">Current</button><button>Later</button></div><button id="acknowledge">Mark this activity reviewed</button><button id="next">Next scene →</button><div class="lesson-footer"></div>';});const c=attachTrainingSequencing({host:window,frame:check,records:[],save:async r=>r,completed:()=>false,status:()=>{}});await delay(300);const d=check.contentDocument,n=d.getElementById('next');assert(!n.disabled,'Teaching scene navigation is not blocked by an activity acknowledgement');n.textContent='Next learning activity →';await delay(300);assert(n.disabled,'Only the transition to the next learning activity waits for acknowledgement');d.getElementById('acknowledge').textContent='Reviewed ✓';await delay(300);assert(!n.disabled,'Activity transition unlocks after the existing acknowledgement');assert(!d.querySelectorAll('#contents button')[1].disabled,'The next activity is available after acknowledgement');c.dispose();status.textContent='DONE: 9 EA compatibility checks passed; no real learner records touched.';}catch(error){status.textContent='FAILED: '+error.message;}
</script>
