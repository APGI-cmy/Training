<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="14" fill="#0e2945"/><text x="36" y="58" fill="#ffe4a3" font-family="Arial" font-size="28">Bring the four activities together</text><rect x="36.0" y="110" width="362.6666666666667" height="210" rx="10" fill="#183c5f" stroke="#5287db" stroke-width="3"/><text x="54.0" y="150" fill="white" font-family="Arial" font-size="23">Need and competence</text><text x="54.0" y="215" fill="#e1ecf4" font-family="Arial" font-size="19">Understand ordinary-control limits</text><text x="54.0" y="243" fill="#e1ecf4" font-family="Arial" font-size="19">and the five capabilities</text><rect x="418.6666666666667" y="110" width="362.6666666666667" height="210" rx="10" fill="#183c5f" stroke="#5badbf" stroke-width="3"/><text x="436.6666666666667" y="150" fill="white" font-family="Arial" font-size="23">Value and fairness</text><text x="436.6666666666667" y="215" fill="#e1ecf4" font-family="Arial" font-size="19">Protect the lawful chain and honest</text><text x="436.6666666666667" y="243" fill="#e1ecf4" font-family="Arial" font-size="19">employees</text><rect x="801.3333333333334" y="110" width="362.6666666666667" height="210" rx="10" fill="#183c5f" stroke="#a889c9" stroke-width="3"/><text x="819.3333333333334" y="150" fill="white" font-family="Arial" font-size="23">Science and safety</text><text x="819.3333333333334" y="215" fill="#e1ecf4" font-family="Arial" font-size="19">Use controlled equipment within</text><text x="819.3333333333334" y="243" fill="#e1ecf4" font-family="Arial" font-size="19">authorised procedures</text><rect x="36" y="350" width="1128" height="112" rx="10" fill="#fff6df"/><text x="56" y="388" fill="#193b5a" font-family="Arial" font-size="19">Revisit the matching activity before retrying a knowledge check.</text></svg>