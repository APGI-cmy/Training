name: ALP W4.2 Build to Green

on:
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "supabase/migrations/010_alp_admin_invitations.sql"
      - "tests/qa-to-red/alp/w4-2-enrolment-catalogue-red.spec.ts"
      - "package.json"
      - ".github/workflows/alp-w4-2-red-proof.yml"
      - "modules/ALP/11-build/evidence/**"
      - "modules/ALP/BUILD_PROGRESS_TRACKER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-build-green:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee w4-2-typecheck-output.txt

      - name: Execute W4.2 GREEN suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:alp:w4-2 2>&1 | tee w4-2-green-output.txt

      - name: Execute W1 and W4.1 regression suites
        shell: bash
        run: |
          set -o pipefail
          npx vitest run tests/qa-to-red/alp/auth.spec.ts tests/qa-to-red/alp/enrolment-access.spec.ts tests/qa-to-red/alp/navigation-loop-breaker.spec.ts 2>&1 | tee w4-2-regression-output.txt

      - name: Build application
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee w4-2-build-output.txt

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alp-w4-2-validation-output
          path: |
            w4-2-typecheck-output.txt
            w4-2-green-output.txt
            w4-2-regression-output.txt
            w4-2-build-output.txt
          if-no-files-found: warn
