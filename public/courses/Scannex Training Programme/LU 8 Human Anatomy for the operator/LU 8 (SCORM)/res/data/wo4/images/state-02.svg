<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="16" fill="#0e2945"/><text x="36" y="58" fill="#ffe4a3" font-family="Arial" font-size="28">Spine 2: Normal Vertebral Anatomy in Projection</text><rect x="36" y="110" width="348" height="210" rx="12" fill="#183c5f" stroke="#5287db" stroke-width="4"/><text x="56" y="151" fill="#fff" font-family="Arial" font-size="23">Three-dimensional</text><text x="56" y="183" fill="#fff" font-family="Arial" font-size="23">bone</text><text x="56" y="204" fill="#e1ecf4" font-family="Arial" font-size="19">Body, paired pedicles and</text><text x="56" y="232" fill="#e1ecf4" font-family="Arial" font-size="19">central process</text><path d="M 389 219 h 25 m -10 -10 l 10 10 -10 10" fill="none" stroke="#efb94e" stroke-width="5"/><rect x="426" y="110" width="348" height="210" rx="12" fill="#183c5f" stroke="#5badbf" stroke-width="4"/><text x="446" y="151" fill="#fff" font-family="Arial" font-size="23">Projected appearance</text><text x="446" y="204" fill="#e1ecf4" font-family="Arial" font-size="19">Structures can overlap</text><text x="446" y="232" fill="#e1ecf4" font-family="Arial" font-size="19">into dense shapes</text><path d="M 779 219 h 25 m -10 -10 l 10 10 -10 10" fill="none" stroke="#efb94e" stroke-width="5"/><rect x="816" y="110" width="348" height="210" rx="12" fill="#183c5f" stroke="#a889c9" stroke-width="4"/><text x="836" y="151" fill="#fff" font-family="Arial" font-size="23">Whole-vertebra</text><text x="836" y="183" fill="#fff" font-family="Arial" font-size="23">context</text><text x="836" y="204" fill="#e1ecf4" font-family="Arial" font-size="19">Check outline, continuity</text><text x="836" y="232" fill="#e1ecf4" font-family="Arial" font-size="19">and position</text><rect x="36" y="353" width="1128" height="111" rx="10" fill="#fff6df"/><text x="57" y="388" fill="#193b5a" font-family="Arial" font-size="19">Projection brings structures at different depths into one image. Interpret each dense feature in the</text><text x="57" y="416" fill="#193b5a" font-family="Arial" font-size="19">context of the whole vertebra.</text></svg>