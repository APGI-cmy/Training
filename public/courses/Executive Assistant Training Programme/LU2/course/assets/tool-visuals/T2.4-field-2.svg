<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270"><title>Exact boundary</title><desc>Teaching diagram for Exact boundary. I can confirm the booking, but cannot describe the venue as secure before the required decisions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a15818"/></marker></defs><rect x="1" y="1" width="758" height="268" rx="16" fill="#fff1df" stroke="#a15818"/><text x="28" y="36" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#a15818"><tspan x="28" dy="0">T2.4 · Exact boundary</tspan></text><rect x="25" y="80" width="214" height="134" rx="12" fill="white" stroke="#a15818"/><text x="132" y="126" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#18364a"><tspan x="132" dy="0">Booking confirmed</tspan></text><path d="M254 84 V222" stroke="#a15818" stroke-width="7"/><text x="490" y="112" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#a15818"><tspan x="490" dy="0">No protective</tspan><tspan x="490" dy="27">assurance</tspan></text><text x="490" y="184" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#18364a"><tspan x="490" dy="0">Required decisions</tspan><tspan x="490" dy="27">pending</tspan></text></svg>