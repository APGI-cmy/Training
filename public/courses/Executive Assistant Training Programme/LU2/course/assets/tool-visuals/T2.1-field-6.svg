<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270"><title>Fallback and emergency routes</title><desc>Teaching diagram for Fallback and emergency routes. The controlled procedure identifies emergency help and an alternative reporting owner.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245f9b"/></marker></defs><rect x="1" y="1" width="758" height="268" rx="16" fill="#eaf2fb" stroke="#245f9b"/><text x="28" y="36" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#245f9b"><tspan x="28" dy="0">T2.1 · Fallback and emergency routes</tspan></text><rect x="22" y="92" width="218" height="118" rx="12" fill="white" stroke="#245f9b" stroke-width="2"/><text x="131" y="131" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#18364a"><tspan x="131" dy="0">Immediate need</tspan></text><path d="M242 151 H267" stroke="#245f9b" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="92" width="218" height="118" rx="12" fill="white" stroke="#245f9b" stroke-width="2"/><text x="379" y="131" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#18364a"><tspan x="379" dy="0">Controlled help</tspan><tspan x="379" dy="27">route</tspan></text><path d="M490 151 H515" stroke="#245f9b" stroke-width="3" marker-end="url(#arrow)"/><rect x="518" y="92" width="218" height="118" rx="12" fill="white" stroke="#245f9b" stroke-width="2"/><text x="627" y="131" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#18364a"><tspan x="627" dy="0">Alternative</tspan><tspan x="627" dy="27">reporting owner</tspan></text><text x="380" y="247" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#245f9b"><tspan x="380" dy="0">The next step remains connected to its proper owner.</tspan></text></svg>