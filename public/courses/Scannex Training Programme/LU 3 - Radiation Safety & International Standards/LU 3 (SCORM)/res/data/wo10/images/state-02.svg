<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="The unit of dose"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#6dc8e3"/></marker></defs><rect width="1200" height="675" fill="#09213e"/><rect x="42" y="38" width="1116" height="599" rx="20" fill="#103254" stroke="#4e82b2" stroke-width="3"/><text x="85" y="110" fill="#fff" font-family="Arial" font-size="38" font-weight="700">The unit of dose</text><path d="M85 141 H1110" stroke="#5b9acb" stroke-width="2"/><circle cx="255" cy="345" r="125" fill="#6dc8e3" opacity=".92"/><text x="255" y="335" text-anchor="middle" fill="#102a48" font-family="Arial" font-size="30" font-weight="700">DOSE</text><text x="255" y="372" text-anchor="middle" fill="#102a48" font-family="Arial" font-size="20">measured and recorded</text><path d="M400 345 H668" stroke="#6dc8e3" stroke-width="12" marker-end="url(#arrow)"/><rect x="705" y="198" width="390" height="250" rx="16" fill="#173f65" stroke="#6dc8e3" stroke-width="3"/><text x="744" y="252" fill="#fff3c5" font-family="Arial" font-size="26" font-weight="700">Key point</text><text x="744" y="300" fill="#fff" font-family="Arial" font-size="18" font-weight="600"><tspan x="744" dy="0">Radiation protection uses the</tspan><tspan x="744" dy="30">sievert. In day-to-day work, dose</tspan><tspan x="744" dy="30">is normally discussed in</tspan><tspan x="744" dy="30">millisieverts and microsieverts.</tspan></text><rect x="84" y="524" width="1032" height="60" rx="10" fill="#0a2948"/><text x="600" y="561" text-anchor="middle" fill="#d6e7f5" font-family="Arial" font-size="19" font-weight="600">Use the authorised process, record each exposure and refer questions through the safety chain.</text></svg>